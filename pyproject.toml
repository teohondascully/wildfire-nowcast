[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire-nowcast"
version = "0.0.0"
description = "Wildfire spread nowcasting: data, model, simulation, and visualization."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "xarray",
    "zarr",
    "torch",
    "earthengine-api",
    "geopandas",
    "rasterio",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
