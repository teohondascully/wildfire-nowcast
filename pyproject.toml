[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire-nowcast"
version = "0.0.0"
description = "Wildfire spread nowcasting: data, model, simulation, and visualization."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "xarray",
    "zarr",
    "pyyaml",
    "torch",
    "earthengine-api",
    "geopandas",
    "rasterio",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
# `slow` is DESELECTED by `make test` and RUN by `make playthrough` / `make check`.
# It exists for exactly one case today: the ELMFIRE non-degeneracy playthrough,
# which runs a real Fortran simulator six times (33 s). Bare `pytest` still runs
# everything -- the deselection lives in the Makefile, so nothing is hidden in a
# default that a reader of this file would not see.
markers = [
    "slow: runs an external simulator or a large scenario; see tests/test_playthrough_registry.py",
]
