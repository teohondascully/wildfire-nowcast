# `make install` runs `pre-commit install` for you, so these arrive with the
# environment rather than as an instruction someone has to remember. Run
# `pre-commit autoupdate` to bump the pinned revs.
#
# The `ruff` hook here is the SAME check `make lint` and CI run, and the rev is
# pinned to the ruff in `requirements.lock`. Those two facts are the point: a
# hook on a different ruff than the gate can pass locally and fail in CI, which
# teaches people to distrust the hook. `tests/test_format_hook.py` pins the
# version agreement, because the sentence above was written down and enforced by
# nothing until it was.
#
# ############################################################################
# NO HOOK IN THIS FILE MAY REWRITE A FILE. READ THIS BEFORE "FIXING" IT BACK.
# ############################################################################
# `ruff-format` ran WITHOUT `--check` until 2026-08-21 and rewrote files during
# `git commit`. That is incompatible with this repository's code-fingerprint
# contract (C-4.2): `eval/reporting.scoring_code_fingerprint` hashes the SOURCE
# BYTES of every module under `model/` and `eval/`, and every run artifact stamps
# that hash at both ends. Measured, not argued: the hook's rewrite of
# `model/train.py` alone moved the fingerprint `85ecff60dff714b8` ->
# `5b44d1d308ebec0d`, and `85ecff60dff714b8` is the hash carried by every S1
# number on disk. A commit of the rewritten file would have published a tree that
# reproduces none of them, with nothing recording why.
#
# THE GENERAL FORM, WHICH IS WHY THIS IS A RULE AND NOT A PATCH: at the time of
# writing `ruff format --check src tests tools` reports 88 files would be
# reformatted and 62 already formatted. A rewriting hook discharges that debt
# file-by-file, SILENTLY, inside whatever commit happens to touch each file --
# and in this repo some of those commits bind published numbers to a fingerprint.
# Formatting debt must be discharged DELIBERATELY, in its own commit that touches
# no logic and records the fingerprint transition, never as a side effect of a
# science commit.
#
# So: `ruff-format` carries `--check` (fails loudly, changes nothing) and `ruff`
# no longer carries `--fix` (same hazard, smaller blast radius: it rewrites only
# newly introduced violations, but it still rewrites during a commit, and the
# tree is lint-clean so removing it is behaviour-identical today). `make format`
# is how you format, scoped to your own directory, on purpose.
#
# CONSEQUENCE, STATED SO IT IS NOT DISCOVERED: while those 88 files exist, a
# commit that touches one of them FAILS here. That is the intended loud failure.
# Format that file in its own labelled commit -- or, if its fingerprint is bound
# to results that are not yet committed, use `SKIP=ruff-format git commit` for
# that one commit, which skips this hook ALONE and leaves the commit-message
# guard and everything else running. `--no-verify` is not the answer and is
# forbidden by the commit rule.

# WITHOUT THIS KEY, `pre-commit install` INSTALLS ONLY THE `pre-commit` HOOK and
# the commit-message guard below would have to be installed by a second command
# that someone has to know about. That is exactly the shape of the failure the
# guard exists to close: a rule that works only if a human remembers a step.
default_install_hook_types: [pre-commit, commit-msg, pre-push]

# EVERY HOOK BELOW DECLARES ITS `stages`, AND THAT IS LOAD-BEARING, NOT TIDINESS.
# A hook with no `stages` key runs at EVERY installed stage. Adding `pre-push` to
# `default_install_hook_types` above therefore silently enlists the formatters
# into `git push` -- measured, in a throwaway clone: one `git push` ran
# `ruff-format` and REWROTE 88 tracked files across directories this repo fences
# between four leads. A guard that edits another lead's module while they are
# running an experiment is a worse defect than the one it was added to prevent.
# Pinning each hook to `pre-commit` preserves exactly the behaviour these hooks
# had when only `pre-commit` and `commit-msg` were installed.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      # NEITHER OF THESE MAY REWRITE A FILE -- see the block at the top of this
      # file for the measurement that forced it. `--fix` and a bare `ruff-format`
      # both edit your worktree during `git commit`; a code fingerprint hashes
      # source bytes, so an invisible edit detaches an artifact from the code
      # that produced it. `tests/test_format_hook.py` asserts both of these
      # arg lists AND measures that the configured commands leave bytes alone.
      - id: ruff
        stages: [pre-commit]
      - id: ruff-format
        args: [--check]
        stages: [pre-commit]

  # Guards against the accidents this repo is actually exposed to: the fire
  # tensors are ~700 MB and deliberately untracked, and `runs/` is another
  # ~78 MB. A stray `git add data/` is the failure that would be expensive to
  # undo in a public history.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: check-json
        stages: [pre-commit]
      - id: detect-private-key
        stages: [pre-commit]

  # LAYER (a) OF THE ATTRIBUTION GUARD. This repository is single author and its
  # history carries no attribution on any commit; one commit that did was pushed
  # to the public remote and had to be amended out. The rules are DERIVED (git's
  # own trailer grammar, git's own identity, git's own remote hosts) rather than
  # kept as a list of tool names. The module docstring says why that
  # distinction is the whole point.
  #
  # THIS LAYER IS DEFEATED BY `git commit --no-verify`, and that is not a
  # hypothetical: it happened during the repair that motivated the guard. Layer
  # (b) is `tests/test_hygiene.py`, which scans every commit reachable from every
  # ref and therefore sees exactly what `--no-verify` let through. Do not treat
  # either layer as sufficient alone.
  #
  # `language: script` runs the file through its own shebang, so the hook works
  # before `.venv` exists and cannot be broken by an environment problem. It is
  # stdlib-only and computes no numbers, so it is not on the interpreter-of-record
  # path that ADR-001 governs.
  - repo: local
    hooks:
      - id: commit-guard
        name: commit message carries no attribution or session url
        entry: tools/commit_guard.py
        language: script
        stages: [commit-msg]
        always_run: true

  # LAYER (b) OF THE PUBLICATION GUARD. `refs/heads/pre-public-backup` is a
  # LOCAL-ONLY branch holding the pre-public history: 52 commits, no merge base
  # with `main`, and 25 files that name internal tooling in comments. One
  # `git push --all` publishes it. `tools/push_guard.py` refuses any ref the
  # remote does not already carry, deriving that set from `refs/remotes/<remote>/`
  # rather than naming a branch.
  #
  # THIS LAYER IS PARTIAL BY MEASUREMENT, NOT BY CHOICE, AND THAT IS WHY THE
  # AUTHORITATIVE ONE IS INSTALLED SEPARATELY. `pre-commit` reads git's pre-push
  # stdin inside its own wrapper and exports only the FIRST pushable ref. On
  # pre-commit 4.6.1 against a dummy remote, `git push --all` published TWO
  # branches while a hook wired here saw `PRE_COMMIT_LOCAL_BRANCH=refs/heads/main`
  # and an empty stdin -- so a guard built on this environment alone would have
  # allowed the exact command it exists to stop. This hook therefore checks that
  # the full-ref-list layer RAN during this push (it leaves a breadcrumb in the
  # git dir) and refuses if it did not. Deleting the authoritative hook stops
  # pushes; it does not silently unguard them.
  #
  # `make hooks` installs both, so `make install` is the only step.
  - repo: local
    hooks:
      - id: push-guard
        name: no ref is published that the remote does not already carry
        entry: tools/push_guard.py --pre-commit-stage
        language: script
        stages: [pre-push]
        always_run: true
        pass_filenames: false
