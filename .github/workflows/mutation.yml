# THE MUTATION SWEEP, ON A SCHEDULE, BECAUSE IT WAS ON NOTHING.
#
# `make mutation` runs the whole test suite once per single-token mutant of
# `common/` and `eval/` and compares the surviving set against
# `PINNED_SURVIVORS` in `tools/mutation.py`. It is NOT part of `make ci` and
# that ruling stands on a measurement: 110.4 min at `68ebd2f` against 245 s for
# the entire rest of the gate, more than an order of magnitude, plus a git
# worktree per worker on the runner.
#
# WHAT THIS FILE FIXES. Until it existed the sweep was in `make ci` and in
# `make check` and in no schedule - that is, in NOTHING - so the pin drifted
# from 21 to 25 survivors with nothing red anywhere. A target nobody runs is
# not better than no target; it is worse, because the repo carries a pin that
# reads like a live check.
#
# WEEKLY, NOT NIGHTLY. One run is roughly two hours of runner time. Weekly puts
# a bound on that and still catches drift long before a human would.
#
# THE FIRST SCHEDULED RUN IS ITSELF AN EXPERIMENT, and this is written down
# BEFORE it happens so the result cannot be interpreted after the fact:
# `PINNED_SURVIVORS` was measured on darwin/arm64 and this runner is
# ubuntu/x86_64. A mutant is KILLED when the suite exits non-zero, so any test
# that behaves differently across platforms can move the set. If the first run
# reports a diff, that diff is a PLATFORM measurement until someone shows
# otherwise - it is not evidence that anyone regressed, and it must not be
# pasted into the pin without saying which machine measured it.
#
# THE CONFOUNDER IS NAMED IN ADVANCE, AND SO IS THE WAY TO FALSIFY IT (I28). A
# search of the whole suite for constructs whose VALUE can differ between
# darwin/arm64 and ubuntu/x86_64 turned up exactly one family able to move this
# set: the three wall-clock assertions in `tests/test_synthetic.py` against
# `MAX_SECONDS = 5.0`, which sit on `common/synthetic.py` - a swept module that
# holds one of the 25 pinned survivors. Measured on darwin/arm64: the 24 h fire
# takes 0.165 s (30.3x margin), the 48 h 0.208 s (24.0x), and the 96 h 1.115 s -
# a **4.48x** margin, which a slower machine under concurrent suites can spend.
# The direction is asymmetric: the runner is stricter, so the failure mode is a
# pinned survivor reading DISAPPEARED-KILLED here and surviving on the laptop.
# It is FALSIFIABLE and not an excuse, because every KILLED row records the node
# ids that killed it. So: if a diff appears, read `detail` on that row. If it
# names one of those three tests, the entry is a stopwatch, not a regression and
# not a platform property either. If it names anything else, it is a real
# finding and gets investigated by that name. A delta whose killing test cannot
# be named is a BLOCKER, never a second pin.
#
# ---------------------------------------------------------------------------
# THE FIRST SCHEDULED RUN HAPPENED, AND IT MEASURED NOTHING AT ALL.
# Run 32704383241, Monday 2026-08-24 08:03 UTC, `fd1ac99`, `--workers 4`, whole
# corpus. The sweep step ran **298 minutes**, was cancelled by `timeout-minutes`
# below, printed NOTHING between the command line and the cancellation, uploaded
# no artifact (`No files were found with the provided path`), and concluded
# `cancelled` - which is neither the green nor the red anybody looks at. Five
# hours of runner time bought no verdict, no file and no colour. `cancelled` is
# the point and not an aside: this project keeps finding checks that cannot
# FAIL, and this is the same defect in a third costume - a check that cannot
# SPEAK. Nobody has to ignore it. It never said anything.
#
# THREE THINGS THAT COST US, ALL FIXED HERE AND IN `tools/mutation.py`:
#
# 1. THE WORK DOES NOT FIT ONE RUNNER. 129 mutants finished in more than 298
#    minutes at 4 workers; the `--max-mutants 3` dispatch (run 32689890495, 2
#    workers) puts one suite run at about 4.7 min. Throughput is the same at 2
#    and 4 workers because the runner is CPU-saturated either way, so the whole
#    corpus is ~5 h on this machine against a 6 h hard job cap. The estimate in
#    this file's own header said "roughly two hours" and it was wrong by 2.5x.
#    The schedule therefore sweeps `--pinned-modules`: the 16 modules
#    `PINNED_SURVIVORS` names, 48 mutants, ~110 min. That adjudicates the
#    DISAPPEARED direction IN FULL - every pinned survivor is measured - and it
#    CANNOT see a survivor that appeared in one of the other 30 modules. The
#    tool prints that limit as `SCOPED SWEEP` on every run rather than leaving
#    it in this comment.
# 2. A RUN KILLED FROM OUTSIDE SAYS NOTHING. `--deadline-minutes` below is the
#    sweep's OWN clock and it is strictly less than `timeout-minutes`, so the
#    process stops itself, keeps the rows it measured, names the mutants it
#    never started, and exits 4: NO MEASUREMENT, which is a different failure
#    from "the survivor set moved" and is now distinguishable from the outside.
# 3. THE RESULT FILE ONLY EXISTED AT THE END. It is now rewritten after every
#    mutant, atomically, so a run that IS killed still uploads what it had.
# ---------------------------------------------------------------------------
name: mutation

on:
  schedule:
    # Mondays, 07:17 UTC. Deliberately off the hour: GitHub queues scheduled
    # jobs at :00 heavily enough that a run can start tens of minutes late.
    - cron: "17 7 * * 1"
  workflow_dispatch:
    inputs:
      workers:
        description: >
          parallel workspaces (one git worktree and one suite each). 2 is the
          only value whose per-mutant cost has been OBSERVED on this runner;
          4 was tried by the first scheduled run and did not improve throughput,
          because the runner is CPU-saturated at either setting.
        default: "2"
      scope:
        description: >
          `pinned` sweeps the 16 modules PINNED_SURVIVORS names (~110 min, and it
          adjudicates DISAPPEARED in full). `whole` sweeps all 46 and does NOT
          fit in this job's timeout - it is here so the attempt is a choice
          somebody makes, with a result file either way, rather than a default
          that quietly produces nothing.
        default: "pinned"
        type: choice
        options: ["pinned", "whole"]
      max_mutants:
        description: >
          truncate to the first N mutants. NON-ZERO MAKES THIS A SMOKE TEST, NOT
          A MEASUREMENT: a partial sweep refuses to adjudicate the pin, because
          every pinned survivor outside the selection would read DISAPPEARED.
          Use it to prove this workflow runs end to end in minutes.
        default: "0"

concurrency:
  # NOT cancel-in-progress. A two-hour measurement cancelled by the next
  # scheduled trigger produces no result and leaks its worktrees on the way out:
  # the sweep's cleanup is a `finally`, and SIGKILL does not run one.
  group: mutation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    name: survivor set over common/ and eval/
    runs-on: ubuntu-latest
    # THE BACKSTOP, NOT THE MECHANISM. The sweep now stops itself at
    # `--deadline-minutes` below and reports; this only catches a hang that the
    # deadline cannot see, because the deadline is read between mutants and a
    # single wedged suite run would sit inside one. Keep it strictly ABOVE the
    # deadline: if it ever fires first, the run is `cancelled` again and says
    # nothing, which is the state this file was rewritten to leave.
    timeout-minutes: 300
    steps:
      # `fetch-depth: 0` for the same reason `ci.yml` needs it, and for one
      # more: this sweep RUNS THE SUITE, and `tests/test_hygiene.py` refuses to
      # pass on a shallow clone. A failing test in the unmutated workspace is
      # DESELECTED by the sweep as an environment artifact, so a shallow
      # checkout would not go red - it would quietly measure with that check
      # switched off.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: requirements.lock

      - name: install
        run: make install

      # FIRST, AND IN SECONDS. This reports pinned survivors that no longer name
      # a live mutant at all. It cannot fail the job on its own: a stale pin is
      # exactly the state the sweep below exists to re-measure, and stopping
      # here would leave the run with nothing to say. The sweep still fails on
      # the same entries, as VANISHED.
      - name: stale pin check (minute 1, not minute 111)
        continue-on-error: true
        run: make mutation-pin

      # `--deadline-minutes 240` against `timeout-minutes: 300`. The 60-minute
      # gap is the room the process needs to write its file, print its rows and
      # exit non-zero - a deadline equal to the timeout is a deadline that never
      # gets to speak.
      - name: sweep
        run: |
          make mutation-scheduled \
            MUTATION_WORKERS="${{ inputs.workers || '2' }}" \
            MUTATION_EXTRA="--deadline-minutes 240 ${{ inputs.scope == 'whole' && ' ' || '--pinned-modules' }} ${{ (inputs.max_mutants && inputs.max_mutants != '0') && format('--max-mutants {0}', inputs.max_mutants) || '' }}"

      # `if: always()`, because the run that FAILS is the one whose result
      # someone needs to read site by site. At `68ebd2f` the only durable record
      # of a 110-minute sweep was 25 descriptors pasted into a blocker by hand,
      # and the run before that left no record at all.
      #
      # `error`, NOT `warn`, AND THIS STEP IS WHY THE WORD MATTERS. On the one
      # run in this repo's history where this step was the only thing standing
      # between us and losing a five-hour measurement - the cancelled schedule
      # above - it concluded SUCCESS having kept zero bytes, and said so in a
      # warning nobody reads: `No files were found with the provided path`. A
      # step that reports green for having preserved nothing is a check that
      # cannot fail, sitting inside the remedy for a check that could not speak.
      # THERE IS NO LEGITIMATE PATH THAT PRODUCES NO FILE ON A RUN WORTH KEEPING.
      # `tools/mutation.py` writes the record once the baseline is green - before
      # the first mutant - and rewrites it after every mutant, so the file exists
      # from minute five of a two-hour run. The only way to reach this step with
      # nothing is a failure before or during the baseline, and on that path the
      # sweep step is already red and "we lost it" is the true statement.
      - name: keep the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-sweep-${{ github.sha }}
          path: outputs/mutation/sweep.json
          retention-days: 90
          if-no-files-found: error
