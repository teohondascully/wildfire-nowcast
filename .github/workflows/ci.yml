# The gate this repo's README tells people to run, run on every push.
#
# WHAT THIS COVERS. Everything that can be checked from a CLEAN CHECKOUT with no
# data and no credentials: lint, the whole pytest suite (including the
# playthrough mutation-coverage gate), the C1-C3 contract checker against a
# freshly generated synthetic fire, and the C6.0 do-nothing null check.
#
# WHAT THIS DOES NOT COVER, stated here rather than left to be discovered:
#   * the 21-fire corpus (~700 MB of tensors) is not in the repo, so the
#     cross-fire split clauses (C3.1/C8) run against a synthetic corpus in
#     tests and are NOT
#     exercised against the real one. `tests/test_splits.py` skips five cases
#     and `tests/test_ignitions.py` one; each prints its reason.
#   * ELMFIRE is a vendored Fortran simulator that is not built here, so
#     `sim/playthrough.py` (G5's non-degeneracy playthrough) skips. The skip is
#     DECLARED and a test asserts it is declared, so it cannot become silent.
#   * Earth Engine ingestion is never exercised: it needs credentials and a
#     registered Cloud project.
#   * `make contract-reporting` is deliberately NOT run: a one-fire synthetic
#     corpus fails C3.3's bootstrap guard (`n_train_blocks >= 2`) by
#     construction, which is the guard working, not a defect to route around.
#     RE-MEASURED at I8 in a clean clone: it is the only target outside this
#     gate that exits non-zero there, it does so for exactly that one reason
#     (63/64 checks pass, 1 reporting gap), and every gate this workflow DOES
#     run is green in the same clone. So the exclusion is still one clause
#     wide and is not hiding a second failure behind the first.
#
# WHAT MAKES THIS RUNNER THE SAME MACHINE AS A DEVELOPER'S. `make install`
# syncs `requirements.lock` with `--require-hashes`, so the resolution is
# performed once, by a human, and recorded - never performed here. That is new
# at I8 and it is the fix for this workflow's longest outage.
#
# The python version is pinned to the interpreter of record (ADR-001, CPython
# 3.12, the same one `make venv` builds). `pyproject.toml` declares
# `requires-python = ">=3.11"`; nothing here proves 3.11 works.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: lint + tests + contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # `fetch-depth: 0` IS LOAD-BEARING, NOT A PREFERENCE. The default is a
      # SHALLOW clone of one commit, and `tests/test_hygiene.py` scans every
      # commit reachable from every ref for attribution in the commit message.
      # On a shallow checkout that scan would see one commit and report clean,
      # which is this project's most expensive recurring failure: a truncated
      # run that reads as a green tree. The test refuses to pass on a shallow
      # repository rather than relying on this line alone, so the two of them
      # fail loudly together instead of agreeing quietly on nothing.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # The lock is what is installed (see below), so it is what the cache
          # must key on. Keying on `pyproject.toml` cached a resolution that
          # `pyproject.toml` does not determine.
          cache-dependency-glob: requirements.lock

      # `make install` builds .venv on the pinned interpreter and then
      # `uv pip sync --require-hashes requirements.lock`, so this runner holds
      # EXACTLY the package set a developer holds - by artifact hash, not by
      # version string. Before I8 it re-resolved from `pyproject.toml` and
      # landed 15 of 73 packages on different versions than the lock names;
      # that divergence, on numpy 2.5.1 vs 2.5.2, is what kept this badge red
      # for seven days while `make typecheck` exited 0 on the author's machine.
      - name: install
        run: make install

      # ONE STEP, DELIBERATELY. `make ci` is the gate; this file's job is to
      # invoke it, not to restate it. Until I8 this workflow listed the six
      # targets itself and `tests/test_ci_matches_makefile.py` asserted that the
      # two lists agreed - which worked, but "two descriptions that a test keeps
      # equal" is a weaker construction than "one description". The test now
      # asserts the stronger property: that this file runs `make ci` and no
      # other gate target, so drift is not detected, it is impossible.
      #
      # THE COST, STATED: GitHub's job view shows one step rather than six, so
      # the summary line no longer names the failing check. `make` prints
      # `*** [Makefile:NN: <target>] Error N` at the end of the log, which is
      # the same information one scroll further down.
      #
      # What `make ci` runs, in order: lint · typecheck (mypy --strict over
      # src/, plus the audit that fails when an exemption goes stale) ·
      # test-all (the whole suite, INCLUDING the cases `make test` deselects as
      # slow) · playthrough (ADR-030 mutation coverage: a playthrough that
      # cannot fail turns this red) · synth + contract (C4 -> C1/C2/C3: a
      # generated fire judged by the same checker the real tensors are judged
      # by, the only end-to-end artifact check that needs no data) ·
      # null-check (C6.0: no metric may lose to a model that predicts nothing).
      - name: make ci
        run: make ci
