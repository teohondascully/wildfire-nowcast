# The gate this repo's README tells people to run, run on every push.
#
# WHAT THIS COVERS. Everything that can be checked from a CLEAN CHECKOUT with no
# data and no credentials: lint, the whole pytest suite (including the
# playthrough mutation-coverage gate), the C1-C3 contract checker against a
# freshly generated synthetic fire, and the C6.0 do-nothing null check.
#
# WHAT THIS DOES NOT COVER, stated here rather than left to be discovered:
#   * the 21-fire corpus (~1.3 GB) is not in the repo, so the cross-fire split
#     clauses (C3.1/C8) run against a synthetic corpus in tests and are NOT
#     exercised against the real one. `tests/test_splits.py` skips five cases
#     and `tests/test_ignitions.py` one; each prints its reason.
#   * ELMFIRE is a vendored Fortran simulator that is not built here, so
#     `sim/playthrough.py` (G5's non-degeneracy playthrough) skips. The skip is
#     DECLARED and a test asserts it is declared, so it cannot become silent.
#   * Earth Engine ingestion is never exercised: it needs credentials and a
#     registered Cloud project.
#   * `make contract-reporting` is deliberately NOT run: a one-fire synthetic
#     corpus fails C3.3's bootstrap guard (`n_train_blocks >= 2`) by
#     construction, which is the guard working, not a defect to route around.
#
# The python version is pinned to the interpreter of record (ADR-001, CPython
# 3.12, the same one `make venv` builds). `pyproject.toml` declares
# `requires-python = ">=3.11"`; nothing here proves 3.11 works.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: lint + tests + contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      # `make install` builds .venv on the pinned interpreter and installs the
      # package with its dev extras, so every target below runs through exactly
      # the interpreter a developer gets (never a system python — see ADR-001).
      - name: install
        run: make install

      - name: lint
        run: make lint

      # mypy --strict over `src/`, plus the audit of the exemption list that
      # lets it pass: a listed module that has become clean fails the build
      # rather than sitting there as permanent debt. Runs from a pinned,
      # isolated tool environment (Makefile: MYPY_VERSION), not from .venv.
      - name: typecheck
        run: make typecheck

      # The whole suite, INCLUDING the cases `make test` deselects as slow.
      - name: tests
        run: make test-all

      # ADR-030: every playthrough must detect all of its own planted defects.
      # A playthrough that cannot fail turns this red.
      - name: playthrough mutation coverage
        run: make playthrough

      # C4 -> C1/C2/C3: generate a synthetic fire and judge it with the same
      # checker the real tensors are judged by. This is the only end-to-end
      # artifact check that needs no data.
      - name: synthetic fire passes the contract
        run: |
          make synth
          make contract

      # C6.0: no metric may lose to a model that predicts nothing.
      - name: null check
        run: make null-check
